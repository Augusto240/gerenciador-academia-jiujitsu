services:
  app:
    build: .
    ports:
      - "4567:4567"
    volumes:
      - .:/usr/src/app
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["bundle", "exec", "ruby", "app.rb", "-o", "0.0.0.0"]
    env_file:
      - .env
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_USER=${DATABASE_USER:-jiujitsu_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-senha_forte_123}
      - DATABASE_NAME=${DATABASE_NAME:-academia_jiujitsu_dev}
      - RACK_ENV=${RACK_ENV:-development}
      - SESSION_SECRET=${SESSION_SECRET:-dev_secret_change_in_production_12345678901234567890}
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    restart: always
    ports:
      - "5433:5432" 
    environment:
      POSTGRES_USER: ${DATABASE_USER:-jiujitsu_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-senha_forte_123}
      POSTGRES_DB: ${DATABASE_NAME:-academia_jiujitsu_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  postgres_data: {}